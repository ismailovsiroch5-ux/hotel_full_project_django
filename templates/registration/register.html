{% extends 'booking/base.html' %}

{% block title %}Ro'yxatdan O'tish{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow border-0 rounded-4">
                <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-user-plus me-2 text-warning"></i> Ro'yxatdan O'tish</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-gold w-100 py-3 mt-3 fs-5 shadow">Ro'yxatdan o'tish</button>
                </form>
                <div class="text-center mt-4">
                    <small class="text-muted">Profilingiz bormi? <a href="{% url 'login' %}" class="fw-bold text-gold">Tizimga kirish</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
